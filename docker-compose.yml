services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  publisher:
    build: ./publisher
    restart: unless-stopped
    env_file: .env
    environment:
      P2000_DB_PATH: /data/alerts.db
      P2000_FILTERS_PATH: /data/filters.yaml
      P2000_PIPE_PATH: /data/flex.pipe
    volumes:
      - ./data:/data
    depends_on:
      - mosquitto
    # Uncomment for P2000_MODE=sdr (pass through RTL-SDR):
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      P2000_DB_PATH: /data/alerts.db
      P2000_HISTORY_LIMIT: ${P2000_HISTORY_LIMIT:-200}
    ports:
      - "${P2000_API_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
    depends_on:
      - publisher

volumes:
  mosquitto-data:
  mosquitto-log:
